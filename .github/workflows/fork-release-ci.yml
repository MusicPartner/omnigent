name: Fork release validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
      - windows-parity/v0.14-integration
      - windows-parity/v0.17-integration
      - windows-parity/v0.19-integration
      - windows-parity/v0.19-isolation-p1-p2
      - windows-parity/v0.20-integration
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  terminal-preparation-contracts:
    name: Terminal preparation contracts (${{ matrix.os }})
    if: ${{ github.ref == 'refs/heads/windows-parity/v0.19-isolation-p1-p2' || github.ref == 'refs/heads/windows-parity/v0.20-integration' || github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMNIGENT_SKIP_WEB_UI: "true"
    steps:
      - name: Check out isolation candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Stage candidate release inputs
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/ci/read-release-inputs.mjs --stage "$RUNNER_TEMP/omnigent-release-inputs" --github-env "$GITHUB_ENV" --ref "$GITHUB_REF" --candidate-sha "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Select the source-matched baseline implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_CANDIDATE_SHA"
          baseline="$RELEASE_BASELINE_SHA"
          case "$RELEASE_BASELINE_CHECK" in
            ancestor)
              git merge-base --is-ancestor "$baseline" "$RELEASE_CANDIDATE_SHA"
              ;;
            characterization-parent)
              test "$(git rev-parse "$baseline^")" = "$RELEASE_CHARACTERIZATION_PARENT_SHA"
              git diff --exit-code "$RELEASE_CHARACTERIZATION_PARENT_SHA" "$baseline" -- omnigent pyproject.toml uv.lock
              ;;
            *) echo "Unsupported release baseline check" >&2; exit 1 ;;
          esac
          git switch --detach "$baseline"
          test "$(git rev-parse HEAD)" = "$baseline"
          echo "Baseline source: $baseline"

      - name: Install baseline dependencies from its own lock
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/terminal-baseline-venv
        run: uv sync --locked --group test --extra tracing

      - name: Characterize unchanged launch preparation on this platform
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/terminal-baseline-venv
        run: |
          set -euo pipefail
          uv run --no-sync python -c "import omnigent; from pathlib import Path; assert Path(omnigent.__file__).resolve().is_relative_to(Path.cwd().resolve()); print(omnigent.__file__)"
          read -r -a targets <<< "$CONTRACT_TESTS"
          uv run --no-sync pytest "${targets[@]}" --collect-only -q --color=no > baseline-collection.log
          grep '^tests/.*::' baseline-collection.log > baseline-nodes.txt
          uv run --no-sync pytest "${targets[@]}" -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q -ra --junitxml=isolation-baseline.xml

      - name: Select the candidate implementation
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install candidate dependencies from its own lock
        run: uv sync --locked --group test --extra tracing

      - name: Fork release tooling contracts
        run: >-
          uv run --no-sync pytest tests/scripts/test_fork_release_tooling.py
          --reruns 0 -n 0 -p no:cacheprovider -q

      - name: Verify maintenance tooling and boundary contracts
        if: ${{ github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/scripts/test_windows_delta_inventory.py tests/scripts/test_windows_contracts.py tests/e2e/test_windows_delta_inventory_e2e.py tests/e2e/test_windows_contracts_e2e.py -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q
          node --test .github/scripts/ci/release-profiles.test.mjs
          uv run --no-sync python .github/scripts/ci/audit-windows-contracts.py --repository "$GITHUB_WORKSPACE" --contracts .github/scripts/ci/windows-contracts.json --mode boundaries

      - name: Verify Windows bundle ownership contracts
        if: ${{ matrix.os == 'windows-latest' && github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        run: >-
          uv run --no-sync pytest tests/scripts/test_install_windows_bundle_ps1.py
          tests/scripts/test_windows_bundle_state_ps1.py
          tests/scripts/test_windows_bundle_installer_caller.py
          tests/scripts/test_uninstall_windows_bundle_ps1.py
          -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q

      - name: Audit reconciled test symbols and platform marker owners
        if: ${{ github.ref == 'refs/heads/windows-parity/v0.20-integration' || github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        shell: bash
        run: >-
          uv run --no-sync python .github/scripts/ci/audit-platform-markers.py
          --baseline-sha "$PLATFORM_MARKER_BASELINE_SHA"

      - name: Verify the same contract nodes
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -c "import omnigent; from pathlib import Path; assert Path(omnigent.__file__).resolve().is_relative_to(Path.cwd().resolve()); print(omnigent.__file__)"
          read -r -a targets <<< "$CONTRACT_TESTS"
          uv run --no-sync pytest "${targets[@]}" --collect-only -q --color=no > candidate-collection.log
          grep '^tests/.*::' candidate-collection.log > candidate-nodes.txt
          git diff --no-index --exit-code baseline-nodes.txt candidate-nodes.txt

      - name: Verify shared launch preparation against the characterized contract
        shell: bash
        run: |
          set -euo pipefail
          read -r -a targets <<< "$CONTRACT_TESTS"
          uv run --no-sync pytest "${targets[@]}" -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q -ra --junitxml=isolation-candidate.xml

      - name: Verify candidate launch failure and placeholder status regressions
        if: ${{ github.ref == 'refs/heads/windows-parity/v0.20-integration' || github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        run: >-
          uv run --no-sync pytest
          tests/terminals/test_launch_failure_cleanup.py
          tests/terminals/test_windows_psmux.py::test_psmux_does_not_infer_exit_status_or_signal_from_placeholders
          tests/terminals/test_windows_psmux.py::test_psmux_dead_pane_keeps_exit_status_unknown
          -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q -ra

      - name: Verify approved relay capability and reader safety
        if: ${{ github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        run: >-
          uv run --no-sync pytest
          tests/terminals/test_program_status.py::test_relay_capability_requires_posix
          tests/terminals/test_program_status.py::test_windows_reader_uses_non_signalling_probe
          tests/terminals/test_program_status.py::test_reader_observes_owned_process_exit
          tests/harnesses/claude_native/test_claude_native_program_status.py
          tests/inner/test_terminal.py::test_unsupported_status_relay_preserves_command_and_snapshot
          tests/terminals/test_windows_psmux.py::test_windows_claude_role_launch_uses_supported_status_fallback
          -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q -ra
          --junitxml=isolation-relay-capability.xml

      - name: Upload baseline and candidate contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-preparation-${{ matrix.os }}-${{ github.sha }}
          path: |
            isolation-baseline.xml
            isolation-candidate.xml
            isolation-relay-capability.xml
            baseline-collection.log
            candidate-collection.log
            baseline-nodes.txt
            candidate-nodes.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Verify candidate buffer routing and paste failure safety
        if: ${{ github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        run: >-
          uv run --no-sync pytest
          tests/test_native_mux.py
          tests/dev/lint/test_lint_session_list_visibility.py
          tests/harnesses/claude_native/test_claude_native_bridge.py::test_inject_user_message_pastes_content_then_submits
          tests/harnesses/claude_native/test_claude_native_bridge.py::test_inject_user_message_buffer_failure_cleans_file_without_submitting
          -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q -ra
          --junitxml=isolation-buffer-routing.xml

      - name: Upload candidate buffer routing evidence
        if: ${{ always() && github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buffer-routing-${{ matrix.os }}-${{ github.sha }}
          path: isolation-buffer-routing.xml
          if-no-files-found: warn
          retention-days: 30

  focused-linux:
    name: Focused Linux compatibility
    needs: terminal-preparation-contracts
    if: ${{ !cancelled() && (needs.terminal-preparation-contracts.result == 'success' || needs.terminal-preparation-contracts.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMNIGENT_SKIP_WEB_UI: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install Linux sandbox and terminal test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tmux ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install focused test and lint dependencies
        run: uv sync --locked --group dev --extra tracing

      - name: Content search shell-helper integration regressions
        run: >-
          uv run --no-sync pytest
          tests/runner/test_environment_filesystem.py
          -k content_search -n 0 --reruns 0 --timeout=30
          -p no:cacheprovider -q -ra

      - name: Anthropic request-capture contract
        run: >-
          uv run --no-sync pytest
          tests/server/integration/test_mock_anthropic_messages.py
          -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -q -ra

      - name: Set up pnpm for desktop shutdown regressions
        uses: ./.github/actions/setup-pnpm

      - name: Release test-group runner contracts
        run: node --test .github/scripts/ci/release-test-groups.test.mjs

      - name: Release input staging contracts
        run: node --test .github/scripts/ci/release-inputs.test.mjs

      - name: Portable Codex lifecycle and platform-scoped fixtures
        run: node .github/scripts/ci/run-release-test-group.mjs portable-codex-lifecycle

      - name: Native attachment cache and Windows handle security
        run: node .github/scripts/ci/run-release-test-group.mjs attachment-cache

      - name: Native attachment consumers and resume delivery
        run: node .github/scripts/ci/run-release-test-group.mjs attachment-consumers

      - name: Owned process shutdown, native shell discovery and Codex Stop regressions
        run: node .github/scripts/ci/run-release-test-group.mjs process-shutdown

      - name: Install desktop test runtime dependencies without Electron
        run: pnpm install --frozen-lockfile --prod --ignore-scripts --filter omnigent-desktop-electron

      - name: Desktop host shutdown and manager regressions
        env:
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/web/electron
        run: >-
          node --test
          web/electron/test/windows_host_shutdown.test.js
          web/electron/test/server_manager.test.js

      - name: Ruff Windows integration surfaces
        run: >-
          uv run ruff check
          omnigent/harnesses/claude_native/windows_hooks.py
          omnigent/host/host_listing.py
          omnigent/inner/_windows_shutdown.py
          omnigent/inner/codex_windows.py
          omnigent/inner/claude_windows.py
          omnigent/native/mux.py
          omnigent/inner/sandbox_capabilities.py
          omnigent/native/shell.py
          omnigent/runner/native/windows_env.py
          omnigent/runner/python_probe.py
          omnigent/runner/routing.py
          omnigent/runner/transport_locator.py
          omnigent/server/_runner_transport.py
          omnigent/server/app.py
          omnigent/server/routes/terminal_attach.py
          omnigent/spec/parser.py
          omnigent/spec/validator.py
          omnigent/terminals/backend.py
          omnigent/terminals/capture_bridge.py
          omnigent/terminals/psmux.py
          tests/host/test_host_listing.py
          tests/inner/test_codex_windows.py
          tests/inner/test_claude_windows.py
          tests/test_native_mux.py
          tests/inner/test_windows_shutdown.py
          tests/runner/test_native_windows_env.py
          tests/runner/test_python_probe.py
          tests/terminals/test_windows_psmux.py
          tests/harnesses/claude_native/test_claude_native_windows_hooks.py
          tests/harnesses/claude_native/test_windows_hook_transport.py
          tests/harnesses/claude_native/test_claude_native_bridge.py
          tests/harnesses/claude_native/test_claude_native_status.py
          tests/test_native_shell.py
          dev/windows_launcher/build.py
          dev/windows_launcher/package.py
          dev/windows_launcher/smoke.py
          omnigent/inner/windows_exec_launcher.py
          omnigent/inner/windows_attachments.py
          omnigent/inner/native_attachments.py
          tests/inner/test_windows_attachments.py
          tests/inner/test_native_attachments.py
          tests/inner/test_windows_exec_launcher_runtime.py
          tests/scripts/test_windows_launcher_packaging.py
          tests/scripts/test_install_windows_bundle_ps1.py
          tests/terminals/test_windows_native_launcher_psmux.py
          tests/inner/windows_private_job_launcher.py
          tests/inner/test_windows_private_job_launcher.py

      - name: Focused integration tests
        run: >-
          uv run pytest -q -p no:cacheprovider
          tests/host/test_host_listing.py
          tests/inner/test_codex_windows.py
          tests/inner/test_claude_windows.py
          tests/test_native_mux.py
          tests/inner/test_sandbox_capabilities.py
          tests/inner/test_windows_shutdown.py
          tests/runner/test_native_windows_env.py
          tests/runner/test_python_probe.py
          tests/runner/test_routing.py
          tests/server/test_runner_transport.py
          tests/spec/test_parser.py
          tests/spec/test_validator.py
          tests/terminals/test_windows_psmux.py
          tests/harnesses/claude_native/test_claude_native_windows_hooks.py
          tests/test_native_shell.py
          tests/harnesses/claude_native/test_claude_native_bridge.py
          tests/harnesses/claude_native/test_claude_native_status.py
          tests/harnesses/claude_native/test_windows_hook_transport.py
          tests/test_native_resume_hint.py
          tests/test_native_cost_popup.py
          tests/scripts/test_windows_launcher_packaging.py
          tests/scripts/test_install_windows_bundle_ps1.py

  windows-native:
    name: Native Windows compatibility
    needs: terminal-preparation-contracts
    if: ${{ !cancelled() && (needs.terminal-preparation-contracts.result == 'success' || needs.terminal-preparation-contracts.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      OMNIGENT_SKIP_WEB_UI: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group test --extra tracing

      - name: Focused Windows release regressions
        run: >-
          uv run pytest
          tests/inner/test_codex_executor.py::test_populate_codex_home_config_copies_remote_mcp_oauth_across_filesystems
          tests/inner/test_os_env_grant_reach.py::test_delete_follows_parents_only_into_write_reach
          tests/inner/test_os_env_grant_reach.py::test_delete_removes_a_leaf_link_not_its_target
          tests/inner/test_os_env_grant_reach.py::test_delete_directory_needs_recursive_unless_empty
          tests/inner/test_os_env_grant_reach.py::test_delete_refuses_a_component_that_became_a_symlink
          tests/inner/test_pi_executor.py::test_gateway_refresh_reuses_process_and_fails_closed
          tests/inner/test_pi_executor.py::test_gateway_helper_failure_is_bounded_and_redacted
          tests/inner/test_pi_executor.py::test_gateway_bridge_authenticates_and_cancels_helper_on_shutdown
          tests/terminals/test_windows_psmux.py::test_psmux_launch_uses_isolated_absolute_python_wrapper
          -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -x -vv --tb=short -ra

      - name: Set up pnpm for desktop shutdown regressions
        uses: ./.github/actions/setup-pnpm

      - name: Release test-group runner contracts
        run: node --test .github/scripts/ci/release-test-groups.test.mjs

      - name: Release input staging contracts
        run: node --test .github/scripts/ci/release-inputs.test.mjs

      - name: Portable Codex lifecycle and platform-scoped fixtures
        run: node .github/scripts/ci/run-release-test-group.mjs portable-codex-lifecycle

      - name: Native attachment cache and Windows handle security
        run: node .github/scripts/ci/run-release-test-group.mjs attachment-cache

      - name: Native attachment consumers and resume delivery
        run: node .github/scripts/ci/run-release-test-group.mjs attachment-consumers

      - name: Owned process shutdown, native shell discovery and Codex Stop regressions
        run: node .github/scripts/ci/run-release-test-group.mjs process-shutdown


      - name: Install desktop test runtime dependencies without Electron
        run: pnpm install --frozen-lockfile --prod --ignore-scripts --filter omnigent-desktop-electron

      - name: Desktop host shutdown and manager regressions
        env:
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/web/electron
        run: >-
          node --test
          web/electron/test/windows_host_shutdown.test.js
          web/electron/test/server_manager.test.js

      - name: Import and CLI smoke
        run: |
          uv run python -c "import omnigent; print('import omnigent OK')"
          uv run omni --help
          uv run omnigent --help

      # Keep the hard native-Windows pair from current upstream main and layer
      # the fork's broader Windows parity coverage below it.
      - name: Upstream Windows hard tests
        run: >-
          uv run pytest
          tests/inner/test_proc_and_platform.py
          tests/runtime/test_process_manager.py
          -p no:cacheprovider -q

      - name: Native launcher lifecycle and runtime candidate
        env:
          OMNIGENT_TEST_PRIVATE_JOB_LAUNCHER: "1"
        run: >-
          uv run pytest tests/inner/test_windows_private_job_launcher.py
          tests/inner/test_windows_exec_launcher_runtime.py
          tests/scripts/test_windows_launcher_packaging.py
          -n 0 -p no:cacheprovider -q

      - name: Windows stable subset
        shell: pwsh
        run: .\scripts\windows_safe_pytest.ps1 -StableOnly

      - name: Install psmux
        shell: pwsh
        run: |
          winget install --id marlocarlo.psmux --version 3.4.0 -e --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'psmux installation failed' }
          "$env:LOCALAPPDATA\Microsoft\WinGet\Links" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$env:LOCALAPPDATA\Microsoft\WinGet\Links;$env:PATH"
          $version = psmux --version
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch 'psmux 3\.4\.0(?:\s|$)') { throw "Unexpected psmux version: $version" }
          $version

      - name: Verify real Windows status fallback after psmux installation
        shell: pwsh
        run: |
          uv run pytest tests/terminals/test_windows_psmux.py::test_windows_claude_role_launch_uses_supported_status_fallback -n 0 --reruns 0 --timeout=30 -p no:cacheprovider -vv --tb=short -ra --junitxml=windows-status-fallback.xml
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows status fallback tests failed' }
          [xml]$report = Get-Content -LiteralPath windows-status-fallback.xml -Raw
          if ($report.SelectNodes('//testcase').Count -ne 3 -or $report.SelectNodes('//skipped | //failure | //error').Count -ne 0) {
            throw 'Expected all three Windows startup cases to execute without skips or failures'
          }

      - name: Audit executed Windows startup contract identities
        if: ${{ github.ref == 'refs/heads/windows-parity/v0.20-isolation-p3-p5' }}
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Startup contract source mismatch' }
          uv run --no-sync python .github/scripts/ci/audit-windows-contracts.py --repository $env:GITHUB_WORKSPACE --contracts .github/scripts/ci/windows-contracts.json --mode execution --group windows-status-fallback --junit windows-status-fallback.xml --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Required startup contract identities did not all execute' }

      - name: Upload real Windows status fallback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-status-fallback-${{ github.sha }}
          path: windows-status-fallback.xml
          if-no-files-found: error
          retention-days: 30

      - name: Windows hook and shell consumer tests
        run: >-
          uv run pytest
          tests/harnesses/claude_native/test_windows_hook_transport.py
          tests/test_native_resume_hint.py
          tests/test_native_cost_popup.py
          --deselect tests/test_native_cost_popup.py::test_tmux_last_client_input_at_tracks_keypresses_not_control_clients
          -n 0 -p no:cacheprovider -q

      - name: psmux terminal backend tests
        env:
          OMNIGENT_TEST_PRIVATE_JOB_LAUNCHER: "1"
        run: >-
          uv run pytest
          tests/terminals/test_windows_native_launcher_psmux.py
          tests/terminals/test_windows_psmux.py::test_windows_psmux_backend_launch_send_read_close
          tests/terminals/test_windows_psmux.py::test_windows_psmux_backend_strips_runner_auth_secrets
          tests/terminals/test_windows_psmux.py::test_psmux_backend_reexport_preserves_identity
          tests/terminals/test_windows_psmux.py::test_psmux_python_launcher_preserves_argv_environment_and_exit_status
          tests/terminals/test_windows_psmux.py::test_psmux_launch_resolves_native_claude_before_spawning
          tests/terminals/test_windows_psmux.py::test_windows_claude_bridge_controls_psmux_pane
          tests/terminals/test_windows_psmux.py::test_windows_psmux_preserves_json_argv_and_clears_existing_server_env
          tests/terminals/test_windows_psmux.py::test_windows_claude_paste_targets_resumed_session
          -n 0 -p no:cacheprovider -q

      - name: Claude chat paste routing and failure safety
        run: >-
          uv run pytest
          tests/harnesses/claude_native/test_claude_native_bridge.py::test_inject_user_message_pastes_content_then_submits
          tests/harnesses/claude_native/test_claude_native_bridge.py::test_inject_user_message_buffer_failure_cleans_file_without_submitting
          -n 0 -p no:cacheprovider -q

      - name: Windows command-line parsing helper
        run: >-
          uv run pytest
          tests/terminals/test_windows_command_line.py
          -n 0 -p no:cacheprovider -q

      # Exercise the full selection with native memory diagnostics.
      - name: Broader Windows unit sweep
        env:
          PYTHONMALLOC: debug
        run: >-
          uv run python -X dev -m pytest tests/inner tests/runtime/harnesses
          -m "not posix_only"
          -p no:cacheprovider -vv --tb=short -ra
          --junitxml=broader-windows.xml

      - name: Upload broader Windows test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: broader-windows-${{ github.sha }}
          path: broader-windows.xml
          if-no-files-found: warn
          retention-days: 30

  build-windows-artifact:
    name: Build and install Windows artifact (omni.exe)
    needs: [focused-linux, windows-native]
    if: ${{ !cancelled() && needs.focused-linux.result == 'success' && needs.windows-native.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Stage candidate release inputs
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/ci/read-release-inputs.mjs --stage "$RUNNER_TEMP/omnigent-release-inputs" --github-env "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      # Match current upstream release-omnigent.yml: build the production web
      # bundle before the wheel so the packaged core contains the UI.
      - name: Build web UI
        shell: pwsh
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          Remove-Item -Recurse -Force omnigent/server/static/web-ui -ErrorAction SilentlyContinue
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build

      - name: Build optional native launcher candidate
        shell: pwsh
        run: >-
          python -m dev.windows_launcher.package
          --toolset-version $env:WINDOWS_LAUNCHER_TOOLSET_VERSION
          --sdk-version $env:WINDOWS_SDK_VERSION

      - name: Build core and lockstep SDK distributions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          uv build --out-dir dist
          uv run --no-project --with build python scripts/build_subpackages.py --out-dir dist omnigent-client omnigent-ui-sdk
          Get-ChildItem dist

      - name: Check distribution metadata
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem "dist" -File |
              Where-Object { $_.Name -match '\.(whl|tar\.gz)$' } |
              Select-Object -ExpandProperty FullName
          )
          if ($files.Count -eq 0) {
            throw "No distribution artifacts found in dist"
          }
          uvx twine check $files

      - name: Assert bundled web UI, native asset and console entry points
        shell: pwsh
        run: |
          $expectedVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve wheel version" }
          python .github/scripts/ci/verify-windows-wheel.py --dist-dir dist --expected-version $expectedVersion --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Windows wheel verification failed" }

      # Keep the upstream release-style clean wheel smoke before exercising the
      # downloadable installer itself.
      - name: Smoke-install built wheels like upstream
        shell: pwsh
        run: |
          uv venv --python 3.12 .artifact-smoke
          $python = (Resolve-Path .artifact-smoke\Scripts\python.exe).Path
          $wheels = Get-ChildItem dist\*.whl | ForEach-Object { $_.FullName }
          uv pip install --python $python $wheels

          $omni = (Resolve-Path .artifact-smoke\Scripts\omni.exe).Path
          $omnigent = (Resolve-Path .artifact-smoke\Scripts\omnigent.exe).Path
          & $omni --version
          if ($LASTEXITCODE -ne 0) { throw "omni.exe --version failed" }
          & $omni --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "omni.exe --help failed" }
          & $omnigent --version
          if ($LASTEXITCODE -ne 0) { throw "omnigent.exe --version failed" }
          & $python -c "import omnigent; import omnigent.server.app; print('wheel import smoke OK')"
          & $python -I dev/windows_launcher/smoke.py --require-installed
          if ($LASTEXITCODE -ne 0) { throw "installed native launcher smoke failed" }

      - name: Assemble Windows bundle
        shell: pwsh
        run: |
          $expectedVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve bundle version" }
          python .github/scripts/ci/assemble-windows-bundle.py --repository-root . --wheels-dir dist --output-dir windows-bundle --expected-version $expectedVersion --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Windows bundle assembly failed" }

      - name: Test upstream-style artifact installer and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP ("omnigent-artifact-install-" + [guid]::NewGuid().ToString("N"))
          $uvState = @{}
          foreach ($name in @("UV_SYSTEM_CERTS", "UV_TOOL_DIR", "UV_TOOL_BIN_DIR")) {
            $uvState[$name] = @{ Present = Test-Path "Env:$name"; Value = [Environment]::GetEnvironmentVariable($name, "Process") }
          }
          function Assert-UvEnvironmentRestored {
            foreach ($name in $uvState.Keys) {
              if ((Test-Path "Env:$name") -ne $uvState[$name].Present -or
                  [Environment]::GetEnvironmentVariable($name, "Process") -cne $uvState[$name].Value) {
                throw "Bundle operation did not restore $name"
              }
            }
          }
          & .\windows-bundle\install.ps1 -InstallDir $installDir -NoPath -SkipPsmux
          if ($LASTEXITCODE -ne 0) { throw "artifact installer failed" }
          Assert-UvEnvironmentRestored
          $receiptPath = Join-Path $installDir ".omnigent-bundle-receipt.json"
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.schema_version -ne 1 -or $receipt.product -ne "omnigent-windows-bundle") {
            throw "Artifact installer did not create a valid ownership receipt"
          }
          & .\windows-bundle\install.ps1 -InstallDir $installDir -NoPath -SkipPsmux
          if ($LASTEXITCODE -ne 0) { throw "receipted artifact reinstall failed" }
          Assert-UvEnvironmentRestored

          $binDir = Join-Path $installDir "bin"
          $omni = Join-Path $binDir "omni.exe"
          $omnigent = Join-Path $binDir "omnigent.exe"
          if (-not (Test-Path $omni)) { throw "uv tool installer did not create omni.exe" }
          if (-not (Test-Path $omnigent)) { throw "uv tool installer did not create omnigent.exe" }

          & $omni --version
          if ($LASTEXITCODE -ne 0) { throw "installed omni.exe --version failed" }
          & $omni --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "installed omni.exe --help failed" }
          & $omni server --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "installed omni.exe server --help failed" }
          & $omni host --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "installed omni.exe host --help failed" }
          & $omnigent --version
          if ($LASTEXITCODE -ne 0) { throw "installed omnigent.exe --version failed" }

          $sentinel = Join-Path $installDir "unrelated-sentinel.txt"
          [IO.File]::WriteAllText($sentinel, "preserve")
          $refused = $false
          try { & .\windows-bundle\uninstall.ps1 -InstallDir $installDir } catch { $refused = $true }
          if (-not $refused -or -not [IO.File]::Exists($sentinel) -or
              -not [IO.File]::Exists($omni) -or -not [IO.File]::Exists($receiptPath)) {
            throw "Artifact uninstaller did not preserve unexpected content and owned files"
          }
          Assert-UvEnvironmentRestored
          [IO.File]::Delete($sentinel)
          & .\windows-bundle\uninstall.ps1 -InstallDir $installDir
          if (Test-Path $installDir) { throw "artifact uninstaller left the install directory behind" }
          Assert-UvEnvironmentRestored
          & .\windows-bundle\uninstall.ps1 -InstallDir $installDir
          Assert-UvEnvironmentRestored

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnigent-windows-${{ github.sha }}
          path: windows-bundle/
          if-no-files-found: error
          retention-days: 30

  build-windows-desktop-artifact:
    name: Build Windows desktop artifact (Electron ZIP)
    needs: [focused-linux, windows-native]
    if: ${{ !cancelled() && needs.focused-linux.result == 'success' && needs.windows-native.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      OMNIGENT_NOTARIZE_DMG: "false"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python for release version metadata
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install frozen desktop and overlay dependencies
        run: pnpm install --frozen-lockfile --filter web --filter omnigent-desktop-electron

      - name: Build desktop overlays
        run: pnpm --filter omnigent-desktop-electron run build:overlay

      # Packaged dev metadata disables upstream desktop updates for this fork ZIP.
      - name: Build Windows desktop ZIP without publishing
        shell: pwsh
        run: |
          $desktopVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve desktop release version" }
          pnpm --filter omnigent-desktop-electron exec electron-builder --win zip --x64 --publish never "-c.appId=ai.omnigent.desktop-dev" "-c.productName=Omnigent Dev" "-c.directories.output=dist-fork-windows" "-c.extraMetadata.omnigentBuild=dev" "-c.extraMetadata.version=$desktopVersion" "-c.extraMetadata.omnigentSourceCommit=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop ZIP build failed" }
          $desktopArchives = @(Get-ChildItem web/electron/dist-fork-windows -Filter *.zip -File)
          if ($desktopArchives.Count -ne 1) { throw "Expected one Windows desktop ZIP" }
          $desktopArchives | Get-FileHash -Algorithm SHA256

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnigent-windows-desktop-${{ github.sha }}
          path: web/electron/dist-fork-windows/*.zip
          if-no-files-found: error
          retention-days: 30
