name: Remove legacy license classifier

on:
  push:
    branches:
      - windows-parity/v0.14-integration

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-license-classifier]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: windows-parity/v0.14-integration
      - name: Remove superseded license classifier
        shell: python
        run: |
          from pathlib import Path
          path = Path('pyproject.toml')
          text = path.read_text()
          old = '    "License :: OSI Approved :: Apache Software License",\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '', 1))
      - name: Commit classifier cleanup
        shell: bash
        run: |
          git config user.name "MusicPartner Windows Integration"
          git config user.email "keivan@musicpartner.se"
          git add pyproject.toml
          git diff --cached --check
          git commit -m "fix(packaging): remove superseded license classifier"
          git push origin HEAD:windows-parity/v0.14-integration
