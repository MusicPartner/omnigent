# Build-only Docker check for PRs. Compensates for retiring per-commit main
# publishes (oss-publish-images.yml now builds on tags + nightly only): a broken
# Dockerfile / lockfile / frontend build would otherwise not surface until the
# nightly rebuild or a release. Builds the server image single-arch (linux/amd64)
# with the GHA layer cache and runs a `omnigent --help` CLI smoke. Changes to the
# Cloudflare deployment or JavaScript lockfiles additionally run Wrangler's full
# dry-run, including its derived container build. Manual dispatches may also
# publish the tested image to GHCR when explicitly requested.
#
# Scope: the server target exercises the shared builder stage (Python deps +
# web SPA build) that all five published variants inherit, so it catches the
# common breakage without paying for the host/provider variants or the emulated
# arm64 leg.
#
# Blocking merge-gate check: "Docker build" is in the REQUIRED list in
# .github/scripts/merge-ready/required.sh. Because of the paths filter below it
# can legitimately be absent (a PR touching nothing in the image), so it is also
# in ALLOW_SKIP with a workflow_for() arm, and this workflow's name is in
# merge-ready.yml's workflow_run list so the gate re-evaluates when it completes.
name: Docker build

on:
  # Lets contributors validate the image from a branch without opening a PR.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tested image to GHCR"
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Version tag to publish when publish=true"
        required: false
        type: string
        default: "0.14.0.mp"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only build when something that lands in the image changes. Mirrors the
    # publish workflow's former push paths (web/** IS included here — the image
    # bakes the SPA, so a web-only PR can still break the build).
    paths:
      - 'deploy/docker/Dockerfile'
      - 'deploy/docker/entrypoint.py'
      - 'deploy/cloudflare/**'
      - 'omnigent/**'
      - 'web/**'
      - 'sdks/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Security precondition gate (security-gate.yml): untrusted PRs wait for the
  # scan before the build runs on their code; trusted authors pass through.
  gate:
    uses: ./.github/workflows/security-gate.yml

  build:
    name: Docker build
    needs: gate
    # Draft PRs skip the build (ready_for_review re-fires the workflow), matching
    # the pytest job in ci.yml.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect Cloudflare container changes
        id: cloudflare
        env:
          # A manual dispatch has no PR base. Diffing its selected commit against
          # itself leaves the PR-only Cloudflare dry-run disabled.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          changed=false
          while IFS= read -r file; do
            case "$file" in
              deploy/cloudflare/*|pnpm-lock.yaml|pnpm-workspace.yaml|.github/workflows/docker-build.yml)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # Single-arch (amd64) build, no push. load: true imports the result into
      # the runner's Docker so the smoke step below can run it. Shares the same
      # type=gha cache the publish workflow writes, so warm PRs reuse layers.
      - name: Build server image (amd64, no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: omnigent-server:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: CLI smoke
        run: docker run --rm omnigent-server:pr-${{ github.event.pull_request.number || github.sha }} omnigent --help

      - name: Export manual Docker image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker save omnigent-server:pr-${{ github.sha }} | gzip -1 > omnigent-server-${{ github.sha }}.tar.gz
          ls -lh omnigent-server-${{ github.sha }}.tar.gz

      - name: Upload manual Docker image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: omnigent-server-${{ github.sha }}
          path: omnigent-server-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Set up pnpm
        if: steps.cloudflare.outputs.changed == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Install Cloudflare deployment dependencies
        if: steps.cloudflare.outputs.changed == 'true'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm install --frozen-lockfile --filter omnigent-cloudflare

      - name: Cloudflare Worker and container dry-run
        if: steps.cloudflare.outputs.changed == 'true'
        run: pnpm --dir deploy/cloudflare exec wrangler deploy --dry-run

  publish:
    name: Publish Docker image to GHCR
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: omnigent-server-${{ github.sha }}
          path: .

      - name: Load tested Docker image
        env:
          ARCHIVE: omnigent-server-${{ github.sha }}.tar.gz
        run: gzip -dc "$ARCHIVE" | docker load

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push release image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_IMAGE: omnigent-server:pr-${{ github.sha }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $IMAGE_TAG" >&2
            exit 1
          fi

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$SOURCE_IMAGE" "$image_repository:$IMAGE_TAG"
          docker tag "$SOURCE_IMAGE" "$image_repository:$SHA_TAG"
          docker push "$image_repository:$IMAGE_TAG"
          docker push "$image_repository:$SHA_TAG"
          echo "Published $image_repository:$IMAGE_TAG"
          echo "Published $image_repository:$SHA_TAG"
