name: Windows tryout artifact

on:
  workflow_dispatch:
  push:
    branches:
      - windows-parity/v0.14-integration

permissions:
  contents: read

concurrency:
  group: windows-tryout-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  build-windows-tryout:
    name: Build + smoke-install Windows bundle
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build web UI
        shell: pwsh
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          Remove-Item -Recurse -Force omnigent/server/static/web-ui -ErrorAction SilentlyContinue
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build

      - name: Build three lockstep wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          uv build --wheel --out-dir dist
          uv run --no-project --with build python scripts/build_subpackages.py --out-dir dist omnigent-client omnigent-ui-sdk
          Get-ChildItem dist

      - name: Check wheel metadata
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\* | ForEach-Object { $_.FullName }
          uvx twine check $files

      - name: Assert bundled web UI
        shell: pwsh
        run: |
          @'
          import glob
          import sys
          import zipfile

          wheels = sorted(glob.glob("dist/omnigent-*.whl"))
          if not wheels:
              sys.exit("no core omnigent wheel found")
          wheel = wheels[-1]
          names = zipfile.ZipFile(wheel).namelist()
          ui = [name for name in names if "server/static/web-ui/" in name]
          has_index = any(name.endswith("server/static/web-ui/index.html") for name in ui)
          print(f"{wheel}: {len(ui)} web UI files; index.html={has_index}")
          if not ui or not has_index:
              sys.exit("web UI bundle missing from core wheel")
          '@ | python -

      - name: Smoke-install built wheels on Windows
        shell: pwsh
        run: |
          uv venv --python 3.12 .tryout-smoke
          $python = (Resolve-Path .tryout-smoke\Scripts\python.exe).Path
          $wheels = Get-ChildItem dist\*.whl | ForEach-Object { $_.FullName }
          uv pip install --python $python $wheels
          & .tryout-smoke\Scripts\omnigent.exe --version
          & .tryout-smoke\Scripts\omnigent.exe --help | Out-Null
          & $python -c "import omnigent; import omnigent.server.app; print('wheel import smoke OK')"

      - name: Assemble tryout bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-tryout\wheels | Out-Null
          Copy-Item dist\*.whl windows-tryout\wheels\
          Copy-Item scripts\install_oss.ps1 windows-tryout\install_oss.ps1
          Copy-Item scripts\windows_safe_pytest.ps1 windows-tryout\windows_safe_pytest.ps1
          Copy-Item docs\windows\README.md windows-tryout\WINDOWS-README.md
          Copy-Item docs\windows\test-execution.md windows-tryout\TESTING.md
          @'
          Omnigent v0.14 Windows parity tryout
          ===================================

          Prerequisites:
            - Windows 10/11
            - uv (winget install --id Astral-sh.Uv -e)
            - psmux for native managed terminals (winget install --id marlocarlo.psmux -e)

          Install the exact wheels in this artifact into an isolated environment:

            uv venv --python 3.12 .venv
            $python = (Resolve-Path .venv\Scripts\python.exe).Path
            $wheels = Get-ChildItem .\wheels\*.whl | ForEach-Object { $_.FullName }
            uv pip install --python $python $wheels
            .\.venv\Scripts\omnigent.exe --version
            .\.venv\Scripts\omnigent.exe --help

          Start locally:

            .\.venv\Scripts\omnigent.exe server

          In another PowerShell:

            .\.venv\Scripts\omnigent.exe host --server http://localhost:6767

          This is an integration build, not a published release. Keep it isolated
          from any production/global Omnigent installation while evaluating it.
          '@ | Set-Content -Encoding utf8 windows-tryout\TRYOUT.txt

      - name: Upload Windows tryout bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnigent-v0.14-windows-parity-${{ github.sha }}
          path: windows-tryout/
          if-no-files-found: error
          retention-days: 14
